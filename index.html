<!doctype html>
<!-- AetherMites // Hubert Silaa - MarketCraft v0.5.2 Genesis Block -->
<!-- BrushCraft Lite v1.0.0 — Standalone HTML5 Canvas Brush Painter (GitHub Sample App for AssemblyCraft Integration) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrushCraft Lite — HTML5 Brush Painter</title>
    <style>
      :root {
        --bg: #070b14;
        --panel: rgba(15, 23, 42, 0.85);
        --border: rgba(255, 255, 255, 0.1);
        --accent: #10b981;
        --cyan: #06b6d4;
        --text: #f1f5f9;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--border);
        z-index: 10;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .brand {
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, #10b981, #06b6d4);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.7);
      }
      .uid-pill {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(16, 185, 129, 0.35);
        background: rgba(16, 185, 129, 0.12);
        color: #6ee7b7;
      }
      .uid-pill.standalone {
        border-color: rgba(148, 163, 184, 0.25);
        background: rgba(148, 163, 184, 0.1);
        color: #cbd5e1;
      }
      .btn {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 6px 11px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn:hover { background: rgba(255, 255, 255, 0.14); }
      .btn.active {
        background: #10b981;
        color: #020617;
        border-color: #10b981;
      }
      .btn-primary {
        background: linear-gradient(90deg, #10b981, #06b6d4);
        color: #020617;
        border: none;
        font-weight: 800;
        padding: 7px 14px;
      }
      .btn-primary:hover { filter: brightness(1.1); }
      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .swatch.active {
        transform: scale(1.22);
        border-color: #ffffff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      label.slider-wrap {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
        font-family: ui-monospace, monospace;
      }
      input[type="range"] {
        width: 78px;
        accent-color: #10b981;
      }
      input[type="color"] {
        width: 26px;
        height: 26px;
        border: none;
        background: transparent;
        cursor: pointer;
        padding: 0;
      }
      .canvas-stage {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background:
          radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.08), transparent 45%),
          radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.08), transparent 45%),
          #04070f;
        overflow: hidden;
      }
      canvas {
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
        cursor: crosshair;
        touch-action: none;
        max-width: 100%;
        max-height: 100%;
      }
      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 16px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: var(--muted);
      }
      .title-input {
        background: rgba(2, 6, 23, 0.8);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 9px;
        padding: 5px 10px;
        font-size: 12px;
        width: 160px;
      }
      .toast {
        position: fixed;
        bottom: 46px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(6, 78, 59, 0.95);
        border: 1px solid rgba(52, 211, 153, 0.5);
        color: #d1fae5;
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 30;
      }
      .toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="toolbar">
        <div class="group">
          <div class="brand">
            <span class="brand-dot"></span>
            <span>BrushCraft Lite</span>
          </div>
          <span id="uidPill" class="uid-pill standalone">Standalone Mode</span>
          <input id="artTitle" class="title-input" type="text" value="Neon Horizon Study" placeholder="Artwork title..." />
        </div>

        <div class="group">
          <button class="btn active" data-tool="brush">Brush</button>
          <button class="btn" data-tool="neon">Neon</button>
          <button class="btn" data-tool="spray">Spray</button>
          <button class="btn" data-tool="eraser">Eraser</button>

          <div id="swatches" class="group" style="gap: 5px; margin-left: 4px;"></div>
          <input id="colorPicker" type="color" value="#10b981" title="Custom color" />

          <label class="slider-wrap">
            Size <input id="sizeSlider" type="range" min="2" max="48" value="8" />
            <span id="sizeVal">8px</span>
          </label>
        </div>

        <div class="group">
          <button id="undoBtn" class="btn" title="Undo last stroke">Undo</button>
          <button id="clearBtn" class="btn" title="Clear canvas">Clear</button>
          <button id="savePngBtn" class="btn">Save PNG</button>
          <button id="publishMcraftBtn" class="btn btn-primary">Seal &amp; Publish .mcraft ✓</button>
        </div>
      </div>

      <div class="canvas-stage">
        <canvas id="paintCanvas" width="1120" height="620"></canvas>
      </div>

      <div class="statusbar">
        <span id="telemetryText">Strokes: 0 · Active Points: 0 · Ground-Up Genesis Telemetry Ready</span>
        <span id="bridgeText">AssemblyCraft Bridge: Listening...</span>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
      // AetherMites // Hubert Silaa - MarketCraft v0.5.2 Genesis Block
      const GENESIS_SEAL = 'AetherMites // Hubert Silaa - MarketCraft v0.5.2 Genesis Block';

      const canvas = document.getElementById('paintCanvas');
      const ctx = canvas.getContext('2d');
      const uidPill = document.getElementById('uidPill');
      const artTitleInput = document.getElementById('artTitle');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeVal = document.getElementById('sizeVal');
      const colorPicker = document.getElementById('colorPicker');
      const telemetryText = document.getElementById('telemetryText');
      const bridgeText = document.getElementById('bridgeText');
      const toastEl = document.getElementById('toast');

      const PALETTE = ['#10b981', '#06b6d4', '#f59e0b', '#ec4899', '#a855f7', '#ffffff', '#ef4444'];
      let tool = 'brush';
      let color = '#10b981';
      let brushSize = 8;
      let drawing = false;
      let lastX = 0;
      let lastY = 0;
      let strokeCount = 0;
      let pointCount = 0;
      const undoStack = [];

      // MarketCraft OS / AssemblyCraft Identity Context (injected via URL params or postMessage)
      const params = new URLSearchParams(window.location.search);
      const mcContext = {
        connected: params.get('mc_bridge') === '1',
        creatorUid: params.get('uid') || '',
        developerGithub: params.get('github') || 'github.com/Aethermites/brushcraft-lite',
        softwareName: params.get('app') || 'BrushCraft Lite',
        royaltyBps: Number(params.get('royalty_bps') || '200'),
      };

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        window.clearTimeout(showToast._t);
        showToast._t = window.setTimeout(() => toastEl.classList.remove('show'), 3600);
      }

      function refreshIdentityUI() {
        if (mcContext.creatorUid) {
          uidPill.textContent = 'UID: ' + mcContext.creatorUid.slice(0, 12) + '... ✓';
          uidPill.classList.remove('standalone');
          bridgeText.textContent =
            'AssemblyCraft Bridge: Linked to MarketCraft OS · Tool Royalty ' +
            (mcContext.royaltyBps / 100).toFixed(2) +
            '%';
        } else {
          uidPill.textContent = 'Standalone Mode (Local)';
          uidPill.classList.add('standalone');
          bridgeText.textContent = 'Standalone Mode · Launch inside MarketCraft OS for Sui UID tracking';
        }
      }

      // Listen for MarketCraft OS parent handshake
      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'MC_UID_HANDSHAKE' && data.creatorUid) {
          mcContext.connected = true;
          mcContext.creatorUid = data.creatorUid;
          if (data.developerGithub) mcContext.developerGithub = data.developerGithub;
          if (data.softwareName) mcContext.softwareName = data.softwareName;
          if (typeof data.royaltyBps === 'number') mcContext.royaltyBps = data.royaltyBps;
          refreshIdentityUI();
          showToast('MarketCraft UID synced: ' + mcContext.creatorUid.slice(0, 12) + '...');
        }
      });

      // Fill dark canvas background
      function resetCanvas() {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#0b1120';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Subtle creative grid watermark
        ctx.strokeStyle = 'rgba(255,255,255,0.035)';
        ctx.lineWidth = 1;
        for (let x = 40; x < canvas.width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 40; y < canvas.height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function saveUndoSnapshot() {
        try {
          if (undoStack.length >= 25) undoStack.shift();
          undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        } catch {}
      }

      function updateTelemetry(emitHeartbeat) {
        telemetryText.textContent =
          'Strokes: ' +
          strokeCount +
          ' · Active Points: ' +
          pointCount +
          ' · Ground-Up Proof-of-Progress ' +
          (strokeCount > 0 ? 'VERIFIED ✓' : 'Waiting for strokes...');

        if (emitHeartbeat && window.parent && window.parent !== window) {
          window.parent.postMessage(
            {
              type: 'BRUSHCRAFT_HEARTBEAT',
              creatorUid: mcContext.creatorUid,
              strokeCount,
              pointCount,
              artworkTitle: artTitleInput.value.trim() || 'Untitled Painting',
            },
            '*',
          );
        }
      }

      // Build color swatches
      const swatchesEl = document.getElementById('swatches');
      PALETTE.forEach((hex) => {
        const btn = document.createElement('button');
        btn.className = 'swatch' + (hex === color ? ' active' : '');
        btn.style.background = hex;
        btn.title = hex;
        btn.addEventListener('click', () => {
          color = hex;
          colorPicker.value = hex;
          document.querySelectorAll('.swatch').forEach((s) => s.classList.remove('active'));
          btn.classList.add('active');
        });
        swatchesEl.appendChild(btn);
      });

      colorPicker.addEventListener('input', (e) => {
        color = e.target.value;
        document.querySelectorAll('.swatch').forEach((s) => s.classList.remove('active'));
      });

      sizeSlider.addEventListener('input', (e) => {
        brushSize = Number(e.target.value);
        sizeVal.textContent = brushSize + 'px';
      });

      document.querySelectorAll('[data-tool]').forEach((btn) => {
        btn.addEventListener('click', () => {
          tool = btn.getAttribute('data-tool');
          document.querySelectorAll('[data-tool]').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }

      function startDraw(e) {
        e.preventDefault();
        saveUndoSnapshot();
        drawing = true;
        const pt = getCanvasCoords(e);
        lastX = pt.x;
        lastY = pt.y;
        strokeCount += 1;
        pointCount += 1;
        drawSegment(pt.x, pt.y);
      }

      function drawSegment(x, y) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (tool === 'eraser') {
          ctx.strokeStyle = '#0b1120';
          ctx.lineWidth = brushSize * 1.8;
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.stroke();
        } else if (tool === 'spray') {
          ctx.fillStyle = color;
          const density = Math.max(12, brushSize * 2);
          for (let i = 0; i < density; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * brushSize * 1.5;
            ctx.fillRect(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius, 1.8, 1.8);
          }
        } else {
          ctx.strokeStyle = color;
          ctx.lineWidth = brushSize;
          if (tool === 'neon') {
            ctx.shadowColor = color;
            ctx.shadowBlur = brushSize * 1.8;
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
        ctx.restore();
        lastX = x;
        lastY = y;
      }

      function moveDraw(e) {
        if (!drawing) return;
        e.preventDefault();
        const pt = getCanvasCoords(e);
        pointCount += 1;
        drawSegment(pt.x, pt.y);
        if (pointCount % 12 === 0) updateTelemetry(false);
      }

      function endDraw() {
        if (!drawing) return;
        drawing = false;
        updateTelemetry(true);
      }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      window.addEventListener('touchend', endDraw);

      document.getElementById('undoBtn').addEventListener('click', () => {
        const snap = undoStack.pop();
        if (snap) {
          ctx.putImageData(snap, 0, 0);
          showToast('Undid last stroke');
        }
      });

      document.getElementById('clearBtn').addEventListener('click', () => {
        saveUndoSnapshot();
        resetCanvas();
        showToast('Canvas cleared');
      });

      document.getElementById('savePngBtn').addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = (artTitleInput.value.trim() || 'brushcraft_art').toLowerCase().replace(/\s+/g, '_') + '.png';
        a.click();
        showToast('Saved PNG image');
      });

      async function sha256Hex(str) {
        const bytes = new TextEncoder().encode(str);
        const buf = await crypto.subtle.digest('SHA-256', bytes);
        return (
          'sha256_' +
          Array.from(new Uint8Array(buf))
            .map((b) => b.toString(16).padStart(2, '0'))
            .join('')
        );
      }

      document.getElementById('publishMcraftBtn').addEventListener('click', async () => {
        const title = artTitleInput.value.trim() || 'Untitled BrushCraft Artwork';
        const pngDataUrl = canvas.toDataURL('image/png');
        const artworkSha256 = await sha256Hex(pngDataUrl);

        const mcraftContainer = {
          format: 'MARKETCRAFT_ARTIFACT_V1',
          genesis_attribution: GENESIS_SEAL,
          sealed_at: new Date().toISOString(),
          artwork: {
            title,
            mime_type: 'image/png',
            width: canvas.width,
            height: canvas.height,
            payload_sha256: artworkSha256,
          },
          provenance: {
            creator_uid: mcContext.creatorUid || 'STANDALONE_UNLINKED_LOCAL',
            ground_up_genesis_proof: strokeCount > 0,
            verified_strokes: strokeCount,
            verified_points: pointCount,
          },
          assemblycraft_tool_lineage: {
            software_name: mcContext.softwareName,
            developer_github: mcContext.developerGithub,
            tier_2_tool_royalty_bps: mcContext.royaltyBps,
            constitutional_cap_bps: 300,
          },
          embedded_preview_png: pngDataUrl,
        };

        // Notify MarketCraft OS parent if embedded inside MasterCraft Engine
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(
            {
              type: 'BRUSHCRAFT_PUBLISH_MCRAFT',
              container: mcraftContainer,
            },
            '*',
          );
          showToast('Sealed .mcraft & sent to MarketCraft OS ✓');
        } else {
          // Standalone direct .mcraft download
          const blob = new Blob([JSON.stringify(mcraftContainer, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = title.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.mcraft.json';
          a.click();
          URL.revokeObjectURL(url);
          showToast('Downloaded standalone .mcraft container');
        }
      });

      resetCanvas();
      refreshIdentityUI();
      updateTelemetry(false);

      // Signal readiness to MarketCraft OS parent
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'BRUSHCRAFT_READY' }, '*');
      }
    </script>
  </body>
</html>
